[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "knobu"
dynamic = ["version"]
description = "PowerToys-style utilities for Ubuntu and its flavours"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
# PyGObject with GTK4 + libadwaita comes from the system packages
# (python3-gi, gir1.2-gtk-4.0, gir1.2-adw-1), not from PyPI.
dependencies = ["evdev>=1.7"]
keywords = ["ubuntu", "touchpad", "gestures", "powertoys", "gtk"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]

[project.scripts]
knobu = "knobu.cli:main"

[tool.setuptools.dynamic]
version = { attr = "knobu.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"knobu.ui" = ["icons/*.svg"]
